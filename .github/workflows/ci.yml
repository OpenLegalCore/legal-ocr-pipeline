name: Provider-free CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Compile Python sources
        run: |
          python -m py_compile \
            vertex_parallel_pdf_ocr.py \
            test_vertex_parallel_pdf_ocr.py \
            build_manual_review.py \
            test_manual_review.py

      - name: Run offline unit tests
        run: python -m unittest discover -v

      - name: Check tracked text hygiene
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          raw_paths = subprocess.check_output(["git", "ls-files", "-z"])
          for raw_path in raw_paths.split(b"\0"):
              if not raw_path:
                  continue
              path = Path(os.fsdecode(raw_path))
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              if data and not data.endswith(b"\n"):
                  raise SystemExit(f"missing final newline: {path}")
              for number, line in enumerate(data.splitlines(), 1):
                  if line.endswith((b" ", b"\t")):
                      raise SystemExit(f"trailing whitespace: {path}:{number}")
          PY
