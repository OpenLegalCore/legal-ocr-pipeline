name: Feature request
description: Propose a focused improvement to the OCR pipeline or review tooling.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the concrete user or maintainer problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the smallest useful change and its expected behavior.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Risks and alternatives
      description: Address privacy, reliability, provider calls, compatibility, and simpler alternatives.
    validations:
      required: true
  - type: dropdown
    id: configuration
    attributes:
      label: Accepted configuration impact
      description: Would this change the model, prompt, rendering, concurrency, retries, or request cap?
      options:
        - No
        - Yes; a new evidence record would be required
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This request contains no private document content, credentials, identifiers, or personal data.
          required: true
