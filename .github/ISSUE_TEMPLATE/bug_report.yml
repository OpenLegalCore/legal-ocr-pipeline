name: Bug report
description: Report a reproducible defect using synthetic or public data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include private PDFs, OCR text, page images, credentials, project IDs, tokens, or provider logs. Report security issues through the private channel in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide exact steps using synthetic or clearly licensed public input.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, Poppler, dependency versions, and commit or tag. Remove private identifiers.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add non-sensitive error text or a synthetic example if useful.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private documents, OCR content, credentials, identifiers, and personal data.
          required: true
        - label: This is not a vulnerability report.
          required: true
